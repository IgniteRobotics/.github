# Keeps every public, non-archived IgniteRobotics repo at "collaborators only"
# for opening pull requests. GitHub has no org-wide default for this setting,
# so this sweep sets it on any repo that doesn't have it, new ones included.
name: PR policy sweep

on:
  schedule:
    - cron: "17 6 * * *" # daily 06:17 UTC
  workflow_dispatch:

permissions: {}

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Set collaborators-only PR creation on public repos
        env:
          # Fine-grained token: owner IgniteRobotics, all repositories,
          # Administration read/write (Metadata read is added automatically).
          GH_TOKEN: ${{ secrets.ORG_REPO_ADMIN_TOKEN }}
          ORG: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::ORG_REPO_ADMIN_TOKEN secret is missing or empty"
            exit 1
          fi
          # Listed into a variable first: a failure inside `for x in $(...)`
          # would not stop the script.
          repos=$(gh api --paginate "orgs/$ORG/repos?type=public&per_page=100" \
              --jq '.[] | select(.archived | not)
                        | select(.pull_request_creation_policy != "collaborators_only")
                        | .name')
          changed=0
          for repo in $repos; do
            gh api -X PATCH "repos/$ORG/$repo" \
              -f pull_request_creation_policy=collaborators_only --silent
            echo "set collaborators_only: $repo" | tee -a "$GITHUB_STEP_SUMMARY"
            changed=$((changed + 1))
          done
          echo "repos changed: $changed" | tee -a "$GITHUB_STEP_SUMMARY"
